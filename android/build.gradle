plugins {
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { p ->
        if (p.hasProperty("android")) {
            p.android.ndkVersion = "26.3.11579264"
            def ndkDir = null
            try {
                ndkDir = p.android.ndkDirectory
            } catch (Exception ignored) {
                // NDK aún no instalado: AGP lo resolverá al compilar
            }
            if (ndkDir != null && ndkDir.exists()) {
                p.android.defaultConfig {
                    externalNativeBuild {
                        cmake {
                            cppFlags "-nostdinc++", "-isystem${ndkDir}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1", "-isystem${ndkDir}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include", "-isystem${ndkDir}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android"
                        }
                    }
                }
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
