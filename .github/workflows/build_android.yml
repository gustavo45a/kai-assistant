name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Android NDK
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" > /dev/null

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --android-skip-build-dependency-validation

    - name: Prepare Release
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        cp build/app/outputs/flutter-apk/app-release.apk vantablack_hub.apk

    - name: Upload to Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "vantablack_hub.apk"
        tag: "v${{ env.VERSION }}"
        name: "Vantablack Hub v${{ env.VERSION }}"
        allowUpdates: true
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
